version: '3.9'

services:
  nginx_proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/certs:/etc/nginx/certs:ro
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - app_network

  nginx_letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx_letsencrypt
    restart: always
    depends_on:
      - nginx_proxy
    environment:
      DEFAULT_EMAIL: diarra.msa@gmail.com
    volumes:
      - /etc/nginx/certs:/etc/nginx/certs
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app_network

  api:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: api
    expose:
      - "8000"
    env_file:
      - ./money_transfer/.env
    environment:
      ENV: docker
      VIRTUAL_HOST: api.chapdemo.ru
      LETSENCRYPT_HOST: api.chapdemo.ru
      LETSENCRYPT_EMAIL: diarra.msa@gmail.com
      DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: >
      bash -c "uvicorn src:app --host 0.0.0.0 --port 8000"
    networks:
      - app_network
    depends_on:
      - db

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: frontend
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: www.chapdemo.ru,chapdemo.ru
      LETSENCRYPT_HOST: www.chapdemo.ru,chapdemo.ru
      LETSENCRYPT_EMAIL: diarra.msa@gmail.com
    networks:
      - app_network
    depends_on:
      - api

  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - ./money_transfer/.env
    volumes:
      - money_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app_network

  celery_worker:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: celery_worker
    command: >
      bash -c "cd /app && celery -A src.celery:celery_app worker --loglevel=info -E"
    env_file:
      - ./money_transfer/.env
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - redis
      - api

  flower:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: flower
    command: celery -A src.celery:celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - redis
      - api

volumes:
  money_data:

networks:
  app_network:
    driver: bridge
