version: '3.9'

services:
  nginx_proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HTTPS_METHOD=redirect 
    volumes:
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d:ro
      - ./html:/usr/share/nginx/html
      - ./auth:/etc/nginx/auth:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro,z
    labels:
      - com.github.nginx-proxy.nginx-proxy
    networks:
      - app_network

  nginx_letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx_letsencrypt
    restart: always
    depends_on:
      - nginx_proxy
    environment:
      DEFAULT_EMAIL: diarra.msa@gmail.com
      NGINX_PROXY_CONTAINER: nginx_proxy
    volumes:
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    networks:
      - app_network

  api:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: api
    expose:
      - "8000"
    env_file:
      - ./money_transfer/.env
    environment:
      ENV: docker
      VIRTUAL_HOST: api.chapdemo.ru
      LETSENCRYPT_HOST: api.chapdemo.ru
      LETSENCRYPT_EMAIL: diarra.msa@gmail.com
      DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: >
      bash -c "uvicorn src:app --host 0.0.0.0 --port 8000"
    networks:
      - app_network
    depends_on:
      - db

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: frontend
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: www.chapdemo.ru,chapdemo.ru
      LETSENCRYPT_HOST: www.chapdemo.ru,chapdemo.ru
      LETSENCRYPT_EMAIL: diarra.msa@gmail.com
    networks:
      - app_network
    depends_on:
      - nginx_proxy
      - nginx_letsencrypt
      - api

  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - ./money_transfer/.env
    volumes:
      - money_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - app_network
    expose:
      - 6379

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - app_network
    expose:
      - 5672
    ports:
      - "127.0.0.1:15672:15672"

  celery_worker:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: celery_worker
    command: >
      bash -c "cd /app && celery -A src.celery:celery_app worker --loglevel=info -E"
    env_file:
      - ./money_transfer/.env
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - redis
      - api

  flower:
    build:
      context: ./money_transfer
      dockerfile: Dockerfile
    container_name: flower
    command: celery -A src.celery:celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    environment:
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//"
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - redis
      - api
    expose:
      - 5555

  management_proxy:
    image: nginx:alpine
    container_name: management_proxy
    environment:
      VIRTUAL_HOST: management.chapdemo.ru
      LETSENCRYPT_HOST: management.chapdemo.ru
      LETSENCRYPT_EMAIL: diarra.msa@gmail.com
    volumes:
      - ./vhost.d:/etc/nginx/vhost.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./auth:/etc/nginx/auth:ro
      - ./html:/usr/share/nginx/html  # Ajout important pour le challenge ACME
    networks:
      - app_network
    depends_on:
      - nginx_proxy
      - nginx_letsencrypt
      - rabbitmq
      - flower

volumes:
  money_data:

networks:
  app_network:
    driver: bridge